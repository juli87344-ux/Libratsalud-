async function guardarHistorial(
  habitacion,
  cama,
  estado,
  operador,
  inicio
){


  /*
    Primero cerramos cualquier
    etapa anterior de esa cama
    que todavía no tenga FIN.
  */


  const cerrarAnterior =
    await fetch(

      SUPABASE_URL +

      "/rest/v1/historial_camas" +

      "?habitacion=eq." +
      encodeURIComponent(
        habitacion
      ) +

      "&cama=eq." +
      encodeURIComponent(
        cama
      ) +

      "&fin=is.null",

      {

        method:"PATCH",

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            SUPABASE_KEY,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=minimal"

        },

        body:
          JSON.stringify({

            fin:inicio

          })

      }

    );


  if(
    !cerrarAnterior.ok
  ){


    throw new Error(

      "No se pudo cerrar " +
      "el historial: " +

      await cerrarAnterior
        .text()

    );

  }



  /*
    Ahora creamos el nuevo
    estado de la cama.
  */


  const crearNuevo =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/historial_camas",

      {

        method:"POST",

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            SUPABASE_KEY,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=minimal"

        },

        body:
          JSON.stringify({

            habitacion:
              habitacion,

            cama:
              cama,

            estado:
              estado,

            inicio:
              inicio,

            fin:
              null,

            operador:
              operador

          })

      }

    );


  if(
    !crearNuevo.ok
  ){


    throw new Error(

      "No se pudo registrar " +
      "el historial: " +

      await crearNuevo
        .text()

    );

  }

}

function urlBase64ToUint8Array(
  base64String
){


  const padding =

    "=".repeat(

      (
        4 -
        base64String.length % 4
      ) % 4

    );


  const base64 =

    (
      base64String +
      padding
    )

    .replace(
      /-/g,
      "+"
    )

    .replace(
      /_/g,
      "/"
    );


  const rawData =
    atob(base64);


  return Uint8Array.from(

    [...rawData].map(

      c =>
        c.charCodeAt(0)

    )

  );

}



async function activarNotificaciones(){


  try{


    if(

      !(
        "Notification"
        in window
      )

      ||

      !(
        "serviceWorker"
        in navigator
      )

      ||

      !(
        "PushManager"
        in window
      )

    ){


      alert(

        "Este teléfono " +
        "no admite " +
        "notificaciones push."

      );


      return;

    }



    const permiso =

      await Notification
        .requestPermission();



    if(
      permiso !==
      "granted"
    ){


      alert(

        "No se concedió " +
        "permiso para las " +
        "notificaciones."

      );


      return;

    }



    const registro =

      await navigator
        .serviceWorker
        .ready;



    let suscripcion =

      await registro
        .pushManager
        .getSubscription();



    if(!suscripcion){


      suscripcion =

        await registro
          .pushManager
          .subscribe({

            userVisibleOnly:
              true,

            applicationServerKey:

              urlBase64ToUint8Array(
                VAPID_PUBLIC_KEY
              )

          });

    }



    const datos =
      suscripcion
        .toJSON();



    const respuesta =

      await fetch(

        SUPABASE_URL +

        "/rest/v1/notificaciones" +

        "?on_conflict=endpoint",

        {

          method:"POST",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "resolution=merge-duplicates,return=minimal"

          },

          body:
            JSON.stringify({

              nombre:
                "Julieta",

              rol:
                "coordinacion",

              endpoint:
                datos.endpoint,

              p256dh:
                datos.keys.p256dh,

              auth:
                datos.keys.auth,

              activo:
                true

            })

        }

      );



    if(
      !respuesta.ok
    ){


      throw new Error(

        await respuesta.text()

      );

    }



    alert(

      "Teléfono registrado " +
      "correctamente en " +
      "Libratsalud 🔔"

    );



  }catch(e){


    alert(

      "ERROR: " +
      e.message

    );


    console.error(e);

  }

}

          ">
            Historial de camas
          </div>
        </div>

        <button
          onclick="cerrarSupervision()"
          style="
            border:0;
            border-radius:10px;
            padding:11px 15px;
            font-weight:700;
            cursor:pointer;
          "
        >
          ✕ Cerrar
        </button>

      </div>
  `;


  if(historial.length === 0){

    contenido += `

      <div style="
        background:white;
        padding:20px;
        border-radius:14px;
        text-align:center;
      ">
        Todavía no hay registros.
      </div>

    `;

  }else{

    historial.forEach(registro => {

      const inicio =
        registro.inicio
        ? new Date(registro.inicio)
            .toLocaleString("es-AR")
        : "-";

      const fin =
        registro.fin
        ? new Date(registro.fin)
            .toLocaleString("es-AR")
        : "Estado actual";


      let duracion = "En curso";

      if(registro.inicio && registro.fin){

        const segundos =
          Math.max(
            0,
            Math.floor(
              (
                new Date(registro.fin) -
                new Date(registro.inicio)
              ) / 1000
            )
          );

        const horas =
          Math.floor(segundos / 3600);

        const minutos =
          Math.floor(
            (segundos % 3600) / 60
          );

        const segundosRestantes =
          segundos % 60;

        duracion =
          horas > 0
          ? horas + " h " +
            minutos + " min"
          : minutos > 0
          ? minutos + " min " +
            segundosRestantes + " s"
          : segundosRestantes + " s";
      }


      contenido += `

        <div style="
          background:white;
          border-radius:14px;
          padding:14px;
          margin-bottom:10px;
          box-shadow:0 2px 8px #00000010;
        ">

          <div style="
            font-weight:800;
            font-size:17px;
            margin-bottom:7px;
          ">
            🛏️ Habitación ${registro.habitacion}
            · Cama ${registro.cama}
          </div>

          <div>
            <strong>Estado:</strong>
            ${estadoTexto(registro.estado)}
          </div>

          <div>
            <strong>Operador:</strong>
            ${registro.operador || "Sin registrar"}
          </div>

          <div>
            <strong>Inicio:</strong>
            ${inicio}
          </div>

          <div>
            <strong>Fin:</strong>
            ${fin}
          </div>

          <div style="
            margin-top:7px;
            font-weight:800;
          ">
            ⏱️ Duración: ${duracion}
          </div>

        </div>

      `;
    });
  }


  contenido += `
    </div>
  `;


  pantalla.innerHTML = contenido;

  document.body.appendChild(pantalla);
}


function cerrarSupervision(){

  const pantalla =
    document.getElementById(
      "pantallaSupervision"
    );

  if(pantalla){
    pantalla.remove();
  }
}
