<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libratsalud · Control de habitaciones</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#17243d">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#f4f6f9;
  color:#172033;
}

header{
  background:#18243a;
  color:white;
  padding:18px 16px;
}

header h1{margin:0;font-size:25px}
header p{margin:4px 0 0;opacity:.8;font-size:13px}

#btnNotificaciones{
  margin:12px 15px 0;
  padding:11px 15px;
  border:0;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

main{
  max-width:760px;
  margin:auto;
  padding:15px;
}

.leyenda{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:16px;
}

.leyenda div{
  background:white;
  padding:10px;
  border-radius:10px;
  font-size:13px;
}

.habitacion{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #00000010;
}

.habitacion h2{
  margin:0 0 9px;
  font-size:18px;
}

.camas{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.cama{
  border:0;
  border-radius:12px;
  padding:13px;
  min-width:110px;
  font-weight:700;
  cursor:pointer;
  color:#172033;
}

.lista{background:#82e29c}
.liberada{background:#ffe36e}
.limpieza{background:#ffb15c}
.reservada{background:#76b7ff}

.detalle{
  display:block;
  font-size:11px;
  font-weight:500;
  margin-top:4px;
}

#mensaje{
  padding:10px;
  text-align:center;
  font-size:13px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.activo{display:flex}

.panel{
  background:white;
  width:100%;
  max-width:420px;
  border-radius:18px;
  padding:18px;
}

.panel h2{margin-top:0}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  margin-bottom:12px;
  font-size:16px;
}

.opcion{
  width:100%;
  padding:13px;
  margin:5px 0;
  border:0;
  border-radius:10px;
  font-weight:700;
}

.cerrar{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:0;
  border-radius:10px;
}

.aviso{
  font-size:12px;
  color:#666;
  margin-top:18px;
  text-align:center;
}
</style>
</head>

<body>

<header>
  <h1>♎ Libratsalud</h1>
  <p>Control de habitaciones y camas</p>
</header>

<button id="btnNotificaciones" onclick="activarNotificaciones()">
  🔔 Activar notificaciones
</button>

<main>

<div class="leyenda">
  <div>🟡 Liberada / limpiar</div>
  <div>🟠 En limpieza</div>
  <div>🟢 Lista</div>
  <div>🔵 Reservada</div>
</div>

<div id="mensaje">Conectando...</div>
<div id="habitaciones"></div>

<p class="aviso">
Piloto Libratsalud · No ingresar nombres ni datos clínicos de pacientes.
</p>

</main>

<div class="modal" id="modal">
<div class="panel">

<h2 id="titulo"></h2>

<input id="persona"
       placeholder="Nombre de quien realiza el cambio">

<button class="opcion liberada"
        onclick="cambiar('liberada')">
🟡 LIBERADA / LIMPIAR
</button>

<button class="opcion limpieza"
        onclick="cambiar('en_limpieza')">
🟠 EN LIMPIEZA
</button>

<button class="opcion lista"
        onclick="cambiar('lista')">
🟢 LISTA
</button>

<button class="opcion reservada"
        onclick="cambiar('reservada')">
🔵 RESERVADA
</button>

<button class="cerrar" onclick="cerrar()">
Cancelar
</button>

</div>
</div>

<script>

const SUPABASE_URL =
"https://wxgqfycnjwryidnedbni.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XZQEiAZsC2cVk5liN3fu6g_6UN3K9-3";

const EDGE_NOTIFICATION_URL =
SUPABASE_URL + "/functions/v1/Enviar-notificacion";

const VAPID_PUBLIC_KEY =
"BE4mcExiOAFq0w1lfLBSaJmMbHGCOyTx_cLnZsCLaEJjrCoCMa4gau11hdqE_Q0wp93qd-qXnTnyJxFqNEK6uvc";

let camas = [];
let seleccion = null;


/* =========================
   CARGAR CAMAS
========================= */

async function cargar(){

  try{

    const r = await fetch(
      SUPABASE_URL +
      "/rest/v1/camas?select=*&order=habitacion,cama",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!r.ok){
      throw new Error(await r.text());
    }

    camas = await r.json();

    document.getElementById("mensaje").textContent =
      "● Sistema conectado";

    mostrar();

  }catch(e){

    document.getElementById("mensaje").textContent =
      "No se pudo conectar con la base";

    console.error(e);
  }
}


/* =========================
   MOSTRAR CAMAS
========================= */

function mostrar(){

  const cont =
    document.getElementById("habitaciones");

  cont.innerHTML = "";

  const grupos = {};

  camas.forEach(c => {

    if(!grupos[c.habitacion]){
      grupos[c.habitacion] = [];
    }

    grupos[c.habitacion].push(c);
  });

  Object.keys(grupos)
    .sort((a,b) => Number(a) - Number(b))
    .forEach(h => {

      const box =
        document.createElement("div");

      box.className = "habitacion";

      const titulo =
        document.createElement("h2");

      titulo.textContent =
        "Habitación " + h;

      const zona =
        document.createElement("div");

      zona.className = "camas";

      grupos[h].forEach(c => {

        const b =
          document.createElement("button");

        b.className =
          "cama " +
          (c.estado === "en_limpieza"
            ? "limpieza"
            : c.estado);

        b.innerHTML =
          "Cama " + c.cama +
          "<span class='detalle'>" +
          estadoTexto(c.estado) +
          (c.responsable
            ? " · " + c.responsable
            : "") +
          "</span>";

        b.onclick = () => abrir(c);

        zona.appendChild(b);
      });

      box.appendChild(titulo);
      box.appendChild(zona);
      cont.appendChild(box);
    });
}


/* =========================
   TEXTO DE ESTADOS
========================= */

function estadoTexto(e){

  if(e === "liberada"){
    return "Liberada / limpiar";
  }

  if(e === "en_limpieza"){
    return "En limpieza";
  }

  if(e === "reservada"){
    return "Reservada";
  }

  return "Lista";
}


/* =========================
   MODAL
========================= */

function abrir(c){

  seleccion = c;

  document.getElementById("titulo").textContent =
    "Habitación " +
    c.habitacion +
    " · Cama " +
    c.cama;

  document.getElementById("persona").value = "";

  document
    .getElementById("modal")
    .classList.add("activo");
}

function cerrar(){

  document
    .getElementById("modal")
    .classList.remove("activo");
}


/* =========================
   ENVIAR PUSH
========================= */

async function enviarNotificacion(title, body){

  try{

    const respuesta = await fetch(
      EDGE_NOTIFICATION_URL,
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          title:title,
          body:body
        })
      }
    );

    if(!respuesta.ok){
      console.error(
        "No se pudo enviar la notificación:",
        await respuesta.text()
      );
    }

  }catch(e){

    /*
      El cambio de estado de la cama ya quedó guardado.
      Un problema con el push no debe impedir el uso de Libratsalud.
    */
    console.error(
      "Error enviando notificación:",
      e
    );
  }
}


/* =========================
   CAMBIAR ESTADO
========================= */

async function cambiar(estado){

  const persona =
    document
      .getElementById("persona")
      .value
      .trim();

  if(!persona){

    alert(
      "Ingresá tu nombre antes de cambiar el estado."
    );

    return;
  }

  if(!seleccion){
    return;
  }

  /*
    Guardamos estos datos antes de recargar las camas.
  */
  const habitacion = seleccion.habitacion;
  const cama = seleccion.cama;

  try{

    const r = await fetch(
      SUPABASE_URL +
      "/rest/v1/camas?habitacion=eq." +
      encodeURIComponent(habitacion) +
      "&cama=eq." +
      encodeURIComponent(cama),
      {
        method:"PATCH",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },

        body:JSON.stringify({
          estado:estado,
          responsable:persona
        })
      }
    );

    if(!r.ok){
      throw new Error(await r.text());
    }

    /*
      Por ahora enviamos push solamente cuando
      una cama queda LIBERADA y necesita limpieza.
    */
    if(estado === "liberada"){

      await enviarNotificacion(
        "🔔 Libratsalud · Limpieza",
        "Habitación " +
          habitacion +
          " · Cama " +
          cama +
          " está liberada y requiere limpieza."
      );
    }

    cerrar();
    await cargar();

  }catch(e){

    alert("ERROR: " + e.message);

    console.error(e);
  }
}


/* =========================
   NOTIFICACIONES DEL TELÉFONO
========================= */

function urlBase64ToUint8Array(base64String){

  const padding =
    "=".repeat(
      (4 - base64String.length % 4) % 4
    );

  const base64 =
    (base64String + padding)
      .replace(/-/g, "+")
      .replace(/_/g, "/");

  const rawData = atob(base64);

  return Uint8Array.from(
    [...rawData].map(
      c => c.charCodeAt(0)
    )
  );
}


async function activarNotificaciones(){

  try{

    if(
      !("Notification" in window) ||
      !("serviceWorker" in navigator) ||
      !("PushManager" in window)
    ){

      alert(
        "Este teléfono no admite notificaciones push."
      );

      return;
    }

    const permiso =
      await Notification.requestPermission();

    if(permiso !== "granted"){

      alert(
        "No se concedió permiso para las notificaciones."
      );

      return;
    }

    const registro =
      await navigator.serviceWorker.ready;

    let suscripcion =
      await registro.pushManager.getSubscription();

    if(!suscripcion){

      suscripcion =
        await registro.pushManager.subscribe({
          userVisibleOnly:true,
          applicationServerKey:
            urlBase64ToUint8Array(
              VAPID_PUBLIC_KEY
            )
        });
    }

    const datos =
      suscripcion.toJSON();

    const respuesta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/notificaciones?on_conflict=endpoint",
        {
          method:"POST",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":"application/json",
            "Prefer":
              "resolution=merge-duplicates,return=minimal"
          },

          body:JSON.stringify({
            nombre:"Julieta",
            rol:"coordinacion",
            endpoint:datos.endpoint,
            p256dh:datos.keys.p256dh,
            auth:datos.keys.auth,
            activo:true
          })
        }
      );

    if(!respuesta.ok){
      throw new Error(
        await respuesta.text()
      );
    }

    alert(
      "Teléfono registrado correctamente en Libratsalud 🔔"
    );

  }catch(e){

    alert(
      "ERROR: " + e.message
    );

    console.error(e);
  }
}


/* =========================
   INICIO
========================= */

cargar();

setInterval(cargar,5000);

if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    () => {

      navigator
        .serviceWorker
        .register("./sw.js")
        .catch(console.error);
    }
  );
}

</script>

</body>
</html>
