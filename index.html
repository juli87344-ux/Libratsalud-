
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libratsalud · Control de habitaciones</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#f4f6f9;
  color:#172033
}
header{
  background:#18243a;
  color:white;
  padding:18px 16px
}
header h1{margin:0;font-size:25px}
header p{margin:4px 0 0;opacity:.8;font-size:13px}
main{max-width:760px;margin:auto;padding:15px}

.leyenda{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:16px
}
.leyenda div{
  background:white;
  padding:10px;
  border-radius:10px;
  font-size:13px
}
.habitacion{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #00000010
}
.habitacion h2{
  margin:0 0 9px;
  font-size:18px
}
.camas{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
.cama{
  border:0;
  border-radius:12px;
  padding:13px;
  min-width:110px;
  font-weight:700;
  cursor:pointer;
  color:#172033
}
.lista{background:#82e29c}
.liberada{background:#ffe36e}
.limpieza{background:#ffb15c}
.reservada{background:#76b7ff}

.detalle{
  display:block;
  font-size:11px;
  font-weight:500;
  margin-top:4px
}
#mensaje{
  padding:10px;
  text-align:center;
  font-size:13px
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:center;
  justify-content:center;
  padding:18px
}
.modal.activo{display:flex}
.panel{
  background:white;
  width:100%;
  max-width:420px;
  border-radius:18px;
  padding:18px
}
.panel h2{margin-top:0}
input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  margin-bottom:12px;
  font-size:16px
}
.opcion{
  width:100%;
  padding:13px;
  margin:5px 0;
  border:0;
  border-radius:10px;
  font-weight:700
}
.cerrar{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:0;
  border-radius:10px
}
.aviso{
  font-size:12px;
  color:#666;
  margin-top:18px;
  text-align:center
}
</style>
</head>

<body>

<header>
<h1>♎ Libratsalud</h1>
<p>Control de habitaciones y camas</p>
</header>

<main>

<div class="leyenda">
  <div>🟡 Liberada / limpiar</div>
  <div>🟠 En limpieza</div>
  <div>🟢 Lista</div>
  <div>🔵 Reservada</div>
</div>

<div id="mensaje">Conectando...</div>
<div id="habitaciones"></div>

<p class="aviso">
Piloto Libratsalud · No ingresar nombres ni datos clínicos de pacientes.
</p>

</main>

<div class="modal" id="modal">
<div class="panel">

<h2 id="titulo"></h2>

<input id="persona"
       placeholder="Nombre de quien realiza el cambio">

<button class="opcion liberada"
        onclick="cambiar('liberada')">
🟡 LIBERADA / LIMPIAR
</button>

<button class="opcion limpieza"
        onclick="cambiar('en_limpieza')">
🟠 EN LIMPIEZA
</button>

<button class="opcion lista"
        onclick="cambiar('lista')">
🟢 LISTA
</button>

<button class="opcion reservada"
        onclick="cambiar('reservada')">
🔵 RESERVADA
</button>

<button class="cerrar" onclick="cerrar()">
Cancelar
</button>

</div>
</div>

<script>

const SUPABASE_URL =
"https://wxgqfycnjwryidnedbni.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XZQEiAZsC2cVk5liN3fu6g_6UN3K9-3";

let camas = [];
let seleccion = null;

async function cargar(){

  try{

    const r = await fetch(
      SUPABASE_URL +
      "/rest/v1/camas?select=*&order=habitacion,cama",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!r.ok){
      throw new Error(await r.text());
    }

    camas = await r.json();

    document.getElementById("mensaje").textContent =
      "● Sistema conectado";

    mostrar();

  }catch(e){

    document.getElementById("mensaje").textContent =
      "No se pudo conectar con la base";

    console.error(e);
  }
}

function mostrar(){

  const cont =
    document.getElementById("habitaciones");

  cont.innerHTML = "";

  const grupos = {};

  camas.forEach(c => {

    if(!grupos[c.habitacion]){
      grupos[c.habitacion] = [];
    }

    grupos[c.habitacion].push(c);
  });

  Object.keys(grupos)
    .sort((a,b) => Number(a) - Number(b))
    .forEach(h => {

      const box =
        document.createElement("div");

      box.className = "habitacion";

      const titulo =
        document.createElement("h2");

      titulo.textContent =
        "Habitación " + h;

      const zona =
        document.createElement("div");

      zona.className = "camas";

      grupos[h].forEach(c => {

        const b =
          document.createElement("button");

        b.className =
          "cama " + (c.estado === "en_limpieza" ? "limpieza" : c.estado);

        b.innerHTML =
          "Cama " + c.cama +
          "<span class='detalle'>" +
          estadoTexto(c.estado) +
          (c.responsable ? " · " + c.responsable : "") +
          "</span>";

        b.onclick = () => abrir(c);

        zona.appendChild(b);
      });

      box.appendChild(titulo);
      box.appendChild(zona);
      cont.appendChild(box);
    });
}

function estadoTexto(e){

  if(e === "liberada"){
    return "Liberada / limpiar";
  }

  if(e === "en_limpieza"){
    return "En limpieza";
  }

  if(e === "reservada"){
    return "Reservada";
  }

  return "Lista";
}

function abrir(c){

  seleccion = c;

  document.getElementById("titulo").textContent =
    "Cama " + c.cama;

  document.getElementById("persona").value = "";

  document
    .getElementById("modal")
    .classList.add("activo");
}

function cerrar(){

  document
    .getElementById("modal")
    .classList.remove("activo");
}

async function cambiar(estado){

  const persona =
    document
      .getElementById("persona")
      .value
      .trim();

  if(!persona){

    alert(
      "Ingresá tu nombre antes de cambiar el estado."
    );

    return;
  }

  try{

    const r = await fetch(
      SUPABASE_URL +
      "/rest/v1/camas?cama=eq." +
      encodeURIComponent(seleccion.cama),
      {
        method:"PATCH",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },

        body:JSON.stringify({
          estado:estado,
          responsable:persona
        })
      }
    );

    if(!r.ok){
      throw new Error(await r.text());
    }

    cerrar();
    await cargar();

  }catch(e){

    alert("ERROR: " + e.message);

    console.error(e);
  }
}

cargar();

setInterval(cargar,5000);

</script>

</body>
</html>
