name: Pulir LibraCare v2

on:
  push:
    paths:
      - ".github/workflows/pulir-libracare-v2.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cambios
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          s=s.replace("Gestión de Camas · Camas listas, pacientes mejor","Sistema de gestión de camas")
          s=s.replace('<div class="brandmark">✚</div>','<div class="brandmark" aria-label="LibraCare">⚖</div>')

          old_css='.top{position:sticky;top:0;z-index:18}.brandmark{width:34px;height:34px;border-radius:10px;background:#e1f6ec;display:grid;place-items:center;color:#0a9a61;font-size:20px;font-weight:950;flex:none}'
          new_css='.top{position:sticky;top:0;z-index:18}.brandmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#fff8df,#f7e7a7);display:grid;place-items:center;color:#b88919;font-size:23px;font-weight:950;flex:none;border:1px solid #ead493;box-shadow:0 3px 9px rgba(137,103,20,.12)}'
          s=s.replace(old_css,new_css)

          s=s.replace('.superstats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 14px}',
                      '.superstats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0 14px}')
          s=s.replace('@media(max-width:560px){.supercharts{grid-template-columns:1fr}.donut{width:104px;height:104px}}',
                      '@media(max-width:560px){.supercharts{grid-template-columns:1fr}.donut{width:104px;height:104px}.superstats{grid-template-columns:repeat(2,1fr)}}')

          old="""  '<div class="superstat">Mayor espera<b>'+ (wait.length?Math.max(...wait):0) +' min</b></div>';"""
          if old not in s:
              old="""  '<div class="superstat">Mayor espera<b>'+(wait.length?Math.max(...wait):0)+' min</b></div>';"""
          new="""  '<div class="superstat">Mayor espera<b>'+(wait.length?Math.max(...wait):0)+' min</b></div>'+
  '<div class="superstat">Limpiezas finalizadas<b>'+hist.filter(x=>x.estado==="en_limpieza"&&x.fin).length+'</b></div>'+
  '<div class="superstat">Demoras +30 min<b>'+hist.filter(x=>x.estado==="liberada"&&mins(x)!==null&&mins(x)>=30).length+'</b></div>';"""
          s=s.replace(old,new)

          p.write_text(s,encoding="utf-8")
          PY
      - name: Guardar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Pulir identidad LibraCare y Supervisión"
          git push
