name: Agregar habitaciones 103 a 108
on:
  push:
    paths:
      - "add_rooms_103_108.py"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python add_rooms_103_108.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Agregar camas 103 A/B a 108 A/B"
          git push
