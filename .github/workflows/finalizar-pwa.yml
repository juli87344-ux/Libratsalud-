name: Finalizar PWA LibraCare
on:
  push:
    paths:
      - ".github/workflows/finalizar-pwa.yml"
permissions:
  contents: write
jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar iconos PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 192 -h 192 icon-libracare.svg > icon-192.png
          rsvg-convert -w 512 -h 512 icon-libracare.svg > icon-512.png
      - name: Actualizar manifest y carga de camas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          mp=Path("manifest.json")
          m=json.loads(mp.read_text(encoding="utf-8"))
          m["icons"]=[
            {"src":"./icon-192.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},
            {"src":"./icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}
          ]
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace('fetch(SUPABASE_URL+"/rest/v1/camas?select=*&order=habitacion,cama",{headers})',
                      'fetch(SUPABASE_URL+"/rest/v1/camas?select=*&order=habitacion,cama&_="+Date.now(),{headers,cache:"no-store"})')
          p.write_text(s,encoding="utf-8")
          PY
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png manifest.json index.html
          git commit -m "Completar instalación PWA y refresco de camas"
          git push
