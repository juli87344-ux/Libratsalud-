name: Aplicar pulido visual LibraCare

on:
  push:
    paths:
      - "polish_ui.py"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar mejoras visuales
        run: python polish_ui.py
      - name: Guardar cambios
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Pulir panel principal de LibraCare"
          git push
